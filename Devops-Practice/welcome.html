<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Student Portal</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/welcome.js" defer></script>
</head>
<body>
    <main class="card">
        <p class="eyebrow">STUDENT PORTAL</p>
        <h1 id="welcome-heading">Welcome</h1>
        <p class="intro">Your student space, all in one place.</p>
        <ol class="steps" aria-label="Account setup"><li>1. Register</li><li>2. Log in</li><li class="active" aria-current="step">3. Welcome</li></ol>
        <section id="profile" hidden aria-label="Your student details">
            <p class="notice">You have successfully logged in.</p>
            <dl><dt>Email address</dt><dd id="student-email"></dd><dt>Phone number</dt><dd id="student-phone"></dd><dt>Branch</dt><dd id="student-branch"></dd></dl>
        </section>
        <p id="message" class="message" role="status" aria-live="polite">Loading your details…</p>
        <button id="logout" type="button">Log out</button>
        <noscript>Enable JavaScript to see your profile.</noscript>
    </main>
</body>
</html>
