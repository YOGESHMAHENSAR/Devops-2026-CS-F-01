<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Student Portal</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/login.js" defer></script>
</head>
<body>
    <main class="card">
        <p class="eyebrow">STUDENT PORTAL</p>
        <h1>Welcome back</h1>
        <p class="intro">Log in with the email and password you registered.</p>
        <ol class="steps" aria-label="Account setup"><li>1. Register</li><li class="active" aria-current="step">2. Log in</li><li>3. Welcome</li></ol>
        <p id="registration-notice" class="notice" role="status" hidden>Account created successfully. You can now log in.</p>
        <form id="login-form">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username" maxlength="254" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" maxlength="128" required>
            <p id="message" class="message" role="status" aria-live="polite"></p>
            <button type="submit">Log in</button>
        </form>
        <p class="footer">New here? <a href="/register">Create an account</a></p>
        <noscript>Enable JavaScript to log in.</noscript>
    </main>
</body>
</html>
