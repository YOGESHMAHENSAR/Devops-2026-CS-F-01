<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration | Student Portal</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/registration.js" defer></script>
</head>
<body>
    <main class="card">
        <p class="eyebrow">STUDENT PORTAL</p>
        <h1>Create your account</h1>
        <p class="intro">Register your details, then log in to your student space.</p>
        <ol class="steps" aria-label="Account setup"><li class="active" aria-current="step">1. Register</li><li>2. Log in</li><li>3. Welcome</li></ol>
        <form id="registration-form">
            <label for="username">Student name</label>
            <input type="text" name="username" id="username" placeholder="Your full name" autocomplete="name" maxlength="100" required>
            <label for="mail">Email address</label>
            <input type="email" name="email" id="mail" placeholder="you@example.com" autocomplete="email" maxlength="254" required>
            <div class="fields">
                <div><label for="no">Phone number</label><input type="tel" name="phone" id="no" placeholder="10-digit mobile number" autocomplete="tel" pattern="[0-9]{10}" minlength="10" maxlength="10" title="Enter a 10-digit phone number" required></div>
                <div><label for="selection">Branch</label><select name="branch" id="selection" required><option value="" disabled selected>Select your branch</option><option value="CSE">CSE</option><option value="CSE(AI)">CSE (AI)</option><option value="CSE(DS)">CSE (DS)</option><option value="EE">EE</option><option value="ME">ME</option></select></div>
            </div>
            <label for="pass">Password</label>
            <input type="password" name="password" id="pass" placeholder="Create a password" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="password-hint" required>
            <small id="password-hint">Use at least 8 characters.</small>
            <p id="message" class="message" role="status" aria-live="polite"></p>
            <button type="submit">Create account</button>
        </form>
        <p class="footer">Already registered? <a href="/login">Log in</a></p>
        <noscript>Enable JavaScript to register and log in.</noscript>
    </main>
</body>
</html>
