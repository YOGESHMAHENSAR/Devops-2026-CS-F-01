# version: '3.8'

services:
  backend:
    build: ./backend
    image: seniorproto-type-backend:latest
    # ... your existing backend config ...
    networks:
      - fsd-shared-network
    ports:
      - "5000:3000"
    environment:
      - PORT=3000
      - FRONTEND_URL=http://localhost:3000
      - ATLAS_DB_URL=${ATLAS_DB_URL}
      - JWT_SECRET=${JWT_SECRET}
    restart: always

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - fsd-shared-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - fsd-shared-network
    

# Add this to the very bottom of the file
networks:
  fsd-shared-network:
    external: true