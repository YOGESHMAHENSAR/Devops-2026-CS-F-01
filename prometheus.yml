global:
  scrape_interval: 5s # How often to pull data

scrape_configs:
  - job_name: 'my-own-website'
    static_configs:
      # Replace with your app's host and port
      # 'host.docker.internal' is used if Prometheus is in Docker and your app is local
      - targets: ['seniorproto-type-backend-1:3000']